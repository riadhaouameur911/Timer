<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Centered Text</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="timer">
      <div class="time-box">
        <span id="h">00</span>
        <p>Hours</p>
      </div>

      <div class="separator">:</div>

      <div class="time-box">
        <span id="m">00</span>
        <p>Minutes</p>
      </div>

      <div class="separator">:</div>

      <div class="time-box">
        <span id="s">00</span>
        <p>Seconds</p>
      </div>
    </div>

    <div class="buttons">
      <button id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="reset">Reset</button>
    </div>
  </body>
</html>
